name: Apply PocketWorld first-page capacity

on:
  push:
    branches:
      - agent/request-full-pocketworld-first-page
    paths:
      - scripts/apply-pocketworld-first-page-limit.mjs
      - .github/workflows/apply-pocketworld-first-page-limit.yml

permissions:
  contents: write

concurrency:
  group: apply-pocketworld-first-page-capacity
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: agent/request-full-pocketworld-first-page
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Apply the reviewed PocketWorld request fix
        run: |
          node --check scripts/apply-pocketworld-first-page-limit.mjs
          node scripts/apply-pocketworld-first-page-limit.mjs
          node --check server/vessel-feed-proxy/pocketworld-live-ais.mjs

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, build, and verify runtime
        run: pnpm check

      - name: Verify generated artifacts
        run: pnpm verify:dist

      - name: Check repository diff
        run: git diff --check

      - name: Build production container
        run: docker build --tag chmarl-datav:complete-first-page .

      - name: Smoke production container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name chmarl-complete-first-page --publish 8787:8787 chmarl-datav:complete-first-page
          cleanup() {
            docker logs chmarl-complete-first-page || true
            docker rm --force chmarl-complete-first-page >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8787/health/live > /tmp/chmarl-live.json; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "The production container did not become live in time." >&2
              exit 1
            fi
            sleep 2
          done

          cat /tmp/chmarl-live.json
          curl --fail --silent --show-error http://127.0.0.1:8787/version

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Request the complete PocketWorld first page"
          git push origin HEAD:agent/request-full-pocketworld-first-page
