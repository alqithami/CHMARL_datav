name: Apply persistent vessel registry

on:
  push:
    branches:
      - agent/persistent-vessel-registry
    paths:
      - server/vessel-feed-proxy/vessel-registry.mjs
      - scripts/smoke-vessel-registry.mjs
      - src/components/VesselRegistryPanel.tsx
      - src/vesselRegistry.css
      - docs/VESSEL_REGISTRY.md
      - scripts/apply-vessel-registry-integration.mjs
      - .github/workflows/apply-vessel-registry-integration.yml
  pull_request:
    branches:
      - main
    paths:
      - server/vessel-feed-proxy/vessel-registry.mjs
      - scripts/smoke-vessel-registry.mjs
      - src/components/VesselRegistryPanel.tsx
      - src/vesselRegistry.css
      - docs/VESSEL_REGISTRY.md
      - scripts/apply-vessel-registry-integration.mjs
      - .github/workflows/apply-vessel-registry-integration.yml

permissions:
  contents: write

concurrency:
  group: apply-persistent-vessel-registry
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out registry branch
        uses: actions/checkout@v6
        with:
          ref: agent/persistent-vessel-registry
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Apply reviewed registry integration
        id: apply_patch
        shell: bash
        run: |
          set +e
          node --check scripts/apply-vessel-registry-integration.mjs
          status=$?
          if [[ "$status" == "0" ]]; then
            node scripts/apply-vessel-registry-integration.mjs
            status=$?
          fi
          if [[ "$status" == "0" ]]; then
            python3 - <<'PY'
          from pathlib import Path
          path = Path("src/components/ReadinessStrip.tsx")
          text = path.read_text()
          old = '      detail: `${providerLabel} · ${fresh.toLocaleString()} fresh · ${positionedPct}% positioned · refreshed ${updatedAt}`,'
          generated = '      detail: `Permanent registry · ${data.registry?.lastKnown?.toLocaleString() ?? 0} last known · ${data.registry?.archived?.toLocaleString() ?? 0} archived · refreshed ${updatedAt}`,'
          replacement = '      detail: `${providerLabel} · ${fresh.toLocaleString()} fresh · ${positionedPct}% positioned · ${data.registry?.lastKnown?.toLocaleString() ?? 0} last known · refreshed ${updatedAt}`,'
          if generated in text:
              text = text.replace(generated, replacement, 1)
          elif old in text:
              text = text.replace(old, replacement, 1)
          else:
              raise SystemExit("Could not align the generated readiness detail")
          path.write_text(text)
          PY
            status=$?
          fi
          if [[ "$status" != "0" ]]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            echo "Registry patch could not be applied; no source commit will be created."
            exit 0
          fi
          node --check server/vessel-feed-proxy/vessel-registry.mjs
          node --check server/vessel-feed-proxy/runtime-v3.mjs
          node --check scripts/smoke-vessel-registry.mjs
          status=$?
          if [[ "$status" != "0" ]]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            echo "Registry syntax verification failed; no source commit will be created."
            exit 0
          fi
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies
        if: steps.apply_patch.outputs.applied == 'true'
        run: pnpm install --frozen-lockfile

      - name: Validate registry and application
        if: steps.apply_patch.outputs.applied == 'true'
        id: validate
        shell: bash
        run: |
          set +e
          pnpm check
          status=$?
          if [[ "$status" == "0" ]]; then
            pnpm verify:dist
            status=$?
          fi
          if [[ "$status" == "0" ]]; then
            git diff --check
            status=$?
          fi
          if [[ "$status" != "0" ]]; then
            echo "validated=false" >> "$GITHUB_OUTPUT"
            echo "Validation failed; no source commit will be created."
            exit 0
          fi
          echo "validated=true" >> "$GITHUB_OUTPUT"

      - name: Build production container
        if: steps.validate.outputs.validated == 'true'
        id: container
        shell: bash
        run: |
          set +e
          docker build --tag chmarl-datav:vessel-registry .
          status=$?
          if [[ "$status" != "0" ]]; then
            echo "validated=false" >> "$GITHUB_OUTPUT"
            echo "Container build failed; no source commit will be created."
            exit 0
          fi
          echo "validated=true" >> "$GITHUB_OUTPUT"

      - name: Smoke production container
        if: steps.validate.outputs.validated == 'true' && steps.container.outputs.validated == 'true'
        id: smoke
        shell: bash
        run: |
          set +e
          docker run --detach --name chmarl-vessel-registry --publish 8787:8787 chmarl-datav:vessel-registry
          for attempt in $(seq 1 35); do
            if curl --fail --silent --show-error http://127.0.0.1:8787/health/live >/tmp/chmarl-live.json; then
              curl --silent --show-error http://127.0.0.1:8787/api/registry/stats >/tmp/registry.json
              cat /tmp/chmarl-live.json
              cat /tmp/registry.json
              docker rm --force chmarl-vessel-registry >/dev/null 2>&1 || true
              echo "validated=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          docker logs chmarl-vessel-registry || true
          docker rm --force chmarl-vessel-registry >/dev/null 2>&1 || true
          echo "validated=false" >> "$GITHUB_OUTPUT"
          echo "Container smoke failed; no source commit will be created."
          exit 0

      - name: Commit validated registry implementation
        if: steps.validate.outputs.validated == 'true' && steps.container.outputs.validated == 'true' && steps.smoke.outputs.validated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Deploy the persistent vessel registry"
          git push origin HEAD:agent/persistent-vessel-registry
