name: Apply vessel registry operations upgrade

on:
  push:
    branches:
      - agent/registry-operations-upgrade
    paths:
      - scripts/apply-registry-operations-upgrade.mjs
      - .github/workflows/apply-registry-operations-upgrade.yml

permissions:
  contents: write

concurrency:
  group: apply-registry-operations-upgrade
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out upgrade branch
        uses: actions/checkout@v6
        with:
          ref: agent/registry-operations-upgrade
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Apply and validate reviewed registry changes
        id: validate
        shell: bash
        run: |
          set +e
          LOG=/tmp/registry-operations-upgrade.log
          : > "$LOG"
          failed_stage=""

          run_stage() {
            stage="$1"
            shift
            echo "=== $stage ===" | tee -a "$LOG"
            "$@" >> "$LOG" 2>&1
            status=$?
            if [[ "$status" != "0" ]]; then
              failed_stage="$stage"
              echo "FAILED ($status): $stage" | tee -a "$LOG"
              return "$status"
            fi
            echo "PASSED: $stage" | tee -a "$LOG"
            return 0
          }

          run_stage "Patch syntax" node --check scripts/apply-registry-operations-upgrade.mjs || true
          if [[ -z "$failed_stage" ]]; then run_stage "Patch application" node scripts/apply-registry-operations-upgrade.mjs || true; fi
          if [[ -z "$failed_stage" ]]; then run_stage "Registry syntax" node --check server/vessel-feed-proxy/vessel-registry.mjs || true; fi
          if [[ -z "$failed_stage" ]]; then run_stage "Runtime syntax" node --check server/vessel-feed-proxy/runtime-v3.mjs || true; fi
          if [[ -z "$failed_stage" ]]; then run_stage "Registry smoke syntax" node --check scripts/smoke-vessel-registry.mjs || true; fi
          if [[ -z "$failed_stage" ]]; then run_stage "Locked dependency install" pnpm install --frozen-lockfile || true; fi
          if [[ -z "$failed_stage" ]]; then run_stage "Application validation" pnpm check || true; fi
          if [[ -z "$failed_stage" ]]; then run_stage "Artifact verification" pnpm verify:dist || true; fi
          if [[ -z "$failed_stage" ]]; then run_stage "Repository diff" git diff --check || true; fi
          if [[ -z "$failed_stage" ]]; then run_stage "Production container build" docker build --tag chmarl-datav:registry-operations . || true; fi

          if [[ -z "$failed_stage" ]]; then
            echo "=== Production container smoke ===" | tee -a "$LOG"
            docker run --detach --name chmarl-registry-operations --publish 8787:8787 chmarl-datav:registry-operations >> "$LOG" 2>&1
            status=$?
            if [[ "$status" == "0" ]]; then
              smoke_ready=false
              for attempt in $(seq 1 30); do
                if curl --fail --silent --show-error http://127.0.0.1:8787/health/live >> "$LOG" 2>&1; then
                  smoke_ready=true
                  break
                fi
                sleep 2
              done
              if [[ "$smoke_ready" != "true" ]]; then
                failed_stage="Production container smoke"
                docker logs chmarl-registry-operations >> "$LOG" 2>&1 || true
              fi
            else
              failed_stage="Production container smoke"
            fi
            docker rm --force chmarl-registry-operations >/dev/null 2>&1 || true
          fi

          if [[ -z "$failed_stage" ]]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
            echo "The registry operations upgrade passed all validation stages."
          else
            echo "result=failure" >> "$GITHUB_OUTPUT"
            echo "failed_stage=$failed_stage" >> "$GITHUB_OUTPUT"
            git reset --hard HEAD
            mkdir -p diagnostics
            cp "$LOG" diagnostics/registry-operations-upgrade-failure.txt
            printf '\nFailed stage: %s\n' "$failed_stage" >> diagnostics/registry-operations-upgrade-failure.txt
            echo "Validation failed at: $failed_stage. A diagnostic will be committed without failing this workflow."
          fi

      - name: Commit validated implementation or diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          if [[ "${{ steps.validate.outputs.result }}" == "success" ]]; then
            git commit -m "Upgrade vessel registry operations"
          else
            git commit -m "Record registry upgrade validation diagnostic"
          fi
          git push origin HEAD:agent/registry-operations-upgrade
