name: Apply public live AIS fallback

on:
  push:
    branches:
      - agent/public-live-ais-fallback
    paths:
      - scripts/apply-public-live-ais-fallback.py
      - server/vessel-feed-proxy/pocketworld-live-ais.mjs
      - scripts/smoke-public-live-ais-fallback.mjs
      - .github/workflows/apply-public-live-ais-fallback.yml

permissions:
  contents: write

concurrency:
  group: apply-public-live-ais-fallback
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out fallback branch
        uses: actions/checkout@v6
        with:
          ref: agent/public-live-ais-fallback
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Validate and apply public live AIS fallback
        run: |
          python3 -m py_compile scripts/apply-public-live-ais-fallback.py
          python3 scripts/apply-public-live-ais-fallback.py

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, build, and verify runtime
        run: pnpm check

      - name: Verify generated artifacts
        run: pnpm verify:dist

      - name: Check repository diff
        run: git diff --check

      - name: Build production container
        run: docker build --tag chmarl-datav:public-ais .

      - name: Smoke production container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name chmarl-datav-public-ais --publish 8787:8787 chmarl-datav:public-ais
          cleanup() {
            docker logs chmarl-datav-public-ais || true
            docker rm --force chmarl-datav-public-ais >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8787/health/live > /tmp/chmarl-live.json; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "The production container did not become live in time." >&2
              exit 1
            fi
            sleep 2
          done

          cat /tmp/chmarl-live.json
          curl --fail --silent --show-error http://127.0.0.1:8787/version
          curl --fail --silent --show-error http://127.0.0.1:8787/ > /tmp/chmarl-index.html
          grep --quiet '<div id="root"></div>' /tmp/chmarl-index.html

      - name: Commit validated public AIS fallback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Add public regional live AIS fallback"
          git push origin HEAD:agent/public-live-ais-fallback
