name: Finalize Leaflet maritime map

on:
  push:
    branches:
      - agent/adopt-leaflet-interactive-map
    paths:
      - .github/workflows/finalize-leaflet-adoption.yml

permissions:
  contents: write

concurrency:
  group: finalize-leaflet-maritime-map
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Leaflet branch
        uses: actions/checkout@v6
        with:
          ref: agent/adopt-leaflet-interactive-map
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Finalize Leaflet source and remove bootstrap files
        run: |
          node --check scripts/finalize-leaflet-adoption.mjs
          node scripts/finalize-leaflet-adoption.mjs
          node --check scripts/check-live-ui-contract.mjs

      - name: Resolve and lock Leaflet dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint, build, and verify runtime
        run: pnpm check

      - name: Verify production artifacts
        run: pnpm verify:dist

      - name: Check repository diff
        run: git diff --check

      - name: Build production container
        run: docker build --tag chmarl-datav:leaflet .

      - name: Smoke production container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name chmarl-datav-leaflet --publish 8787:8787 chmarl-datav:leaflet
          cleanup() {
            docker logs chmarl-datav-leaflet || true
            docker rm --force chmarl-datav-leaflet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8787/health/live > /tmp/chmarl-live.json; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "The production container did not become live in time." >&2
              exit 1
            fi
            sleep 2
          done

          cat /tmp/chmarl-live.json
          curl --fail --silent --show-error http://127.0.0.1:8787/version
          curl --fail --silent --show-error http://127.0.0.1:8787/ > /tmp/chmarl-index.html
          grep --quiet '<div id="root"></div>' /tmp/chmarl-index.html

      - name: Commit validated Leaflet implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Adopt Leaflet for interactive maritime mapping"
          git push origin HEAD:agent/adopt-leaflet-interactive-map
