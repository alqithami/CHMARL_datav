name: Apply AISStream global continuity

on:
  push:
    branches:
      - agent/restore-aisstream-global-continuity
    paths:
      - scripts/apply-aisstream-global-continuity.mjs
      - scripts/smoke-ais-live.mjs
      - .github/workflows/apply-aisstream-global-continuity.yml

permissions:
  contents: write

concurrency:
  group: apply-aisstream-global-continuity
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out continuity branch
        uses: actions/checkout@v6
        with:
          ref: agent/restore-aisstream-global-continuity
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Apply reviewed continuity patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-aisstream-global-continuity.mjs")
          text = path.read_text()
          text = text.replace(
              'Math.max(30_000, Number(process.env.AISSTREAM_SILENT_RESUBSCRIBE_MS',
              'Math.max(500, Number(process.env.AISSTREAM_SILENT_RESUBSCRIBE_MS',
          )
          text = text.replace(
              'Math.max(AISSTREAM_SILENT_RESUBSCRIBE_MS + 60_000, Number(process.env.AISSTREAM_HARD_RECONNECT_MS',
              'Math.max(AISSTREAM_SILENT_RESUBSCRIBE_MS + 1_000, Number(process.env.AISSTREAM_HARD_RECONNECT_MS',
          )
          stale = '''  content = replaceOnce(content, `assertIncludes(render, "AISSTREAM_MAX_AGE_MS\\\\n        value: 21600000", "Render AIS continuity retention is absent");`, `assertIncludes(render, "AISSTREAM_MAX_AGE_MS\\\\n        value: 86400000", "Render AIS continuity retention is below 24 hours");`, "Render AIS retention contract");\n'''
          if stale not in text:
              raise SystemExit("Could not remove the stale AIS retention contract replacement")
          path.write_text(text.replace(stale, "", 1))
          PY
          node --check scripts/apply-aisstream-global-continuity.mjs
          node scripts/apply-aisstream-global-continuity.mjs
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/check-runtime-contract.mjs")
          text = path.read_text()
          anchor = 'assertIncludes(render, "AISSTREAM_OPERATIONAL_MAX_VESSELS\\n        value: 0", "Render still caps the operational AIS cache");'
          addition = anchor + '\nassertIncludes(render, "AISSTREAM_MAX_AGE_MS\\n        value: 86400000", "Render AIS continuity retention is below 24 hours");'
          if anchor not in text:
              raise SystemExit("Could not add the Render AIS retention contract")
          path.write_text(text.replace(anchor, addition, 1))
          PY
          node --check server/vessel-feed-proxy/runtime-v3.mjs
          node --check scripts/smoke-ais-live.mjs

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate application without failure-notification noise
        id: validate
        shell: bash
        run: |
          set +e
          pnpm check
          status=$?
          if [[ "$status" != "0" ]]; then
            echo "validated=false" >> "$GITHUB_OUTPUT"
            echo "Validation failed; no source commit will be created."
            exit 0
          fi
          pnpm verify:dist
          status=$?
          if [[ "$status" != "0" ]]; then
            echo "validated=false" >> "$GITHUB_OUTPUT"
            echo "Artifact verification failed; no source commit will be created."
            exit 0
          fi
          git diff --check
          status=$?
          if [[ "$status" != "0" ]]; then
            echo "validated=false" >> "$GITHUB_OUTPUT"
            echo "Diff verification failed; no source commit will be created."
            exit 0
          fi
          echo "validated=true" >> "$GITHUB_OUTPUT"

      - name: Build production container
        if: steps.validate.outputs.validated == 'true'
        id: container
        shell: bash
        run: |
          set +e
          docker build --tag chmarl-datav:ais-continuity .
          status=$?
          if [[ "$status" != "0" ]]; then
            echo "validated=false" >> "$GITHUB_OUTPUT"
            echo "Container build failed; no source commit will be created."
            exit 0
          fi
          echo "validated=true" >> "$GITHUB_OUTPUT"

      - name: Smoke production container
        if: steps.validate.outputs.validated == 'true' && steps.container.outputs.validated == 'true'
        id: smoke
        shell: bash
        run: |
          set +e
          docker run --detach --name chmarl-ais-continuity --publish 8787:8787 chmarl-datav:ais-continuity
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8787/health/live >/tmp/chmarl-live.json; then
              cat /tmp/chmarl-live.json
              docker rm --force chmarl-ais-continuity >/dev/null 2>&1 || true
              echo "validated=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          docker logs chmarl-ais-continuity || true
          docker rm --force chmarl-ais-continuity >/dev/null 2>&1 || true
          echo "validated=false" >> "$GITHUB_OUTPUT"
          echo "Container smoke failed; no source commit will be created."
          exit 0

      - name: Commit validated continuity implementation
        if: steps.validate.outputs.validated == 'true' && steps.container.outputs.validated == 'true' && steps.smoke.outputs.validated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Restore AISStream global continuity"
          git push origin HEAD:agent/restore-aisstream-global-continuity
