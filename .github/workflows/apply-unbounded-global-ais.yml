name: Apply unbounded global AIS policy

on:
  push:
    branches:
      - agent/unbounded-global-ais
    paths:
      - scripts/apply-unbounded-global-ais.mjs
      - .github/workflows/apply-unbounded-global-ais.yml

permissions:
  contents: write

concurrency:
  group: apply-unbounded-global-ais
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out policy branch
        uses: actions/checkout@v6
        with:
          ref: agent/unbounded-global-ais
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Apply reviewed runtime policy
        run: |
          node --check scripts/apply-unbounded-global-ais.mjs
          node --check scripts/smoke-unbounded-global-ais.mjs
          node scripts/apply-unbounded-global-ais.mjs
          node --check server/vessel-feed-proxy/runtime-v3.mjs
          node --check server/vessel-feed-proxy/datalastic-live-ais.mjs
          node --check server/vessel-feed-proxy/pocketworld-live-ais.mjs

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, build, and verify runtime
        run: pnpm check

      - name: Verify production artifacts
        run: pnpm verify:dist

      - name: Check repository diff
        run: git diff --check

      - name: Build production container
        run: docker build --tag chmarl-datav:unbounded-global-ais .

      - name: Smoke production container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name chmarl-unbounded-global-ais --publish 8787:8787 chmarl-datav:unbounded-global-ais
          cleanup() {
            docker logs chmarl-unbounded-global-ais || true
            docker rm --force chmarl-unbounded-global-ais >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8787/health/live > /tmp/chmarl-live.json; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "The production container did not become live in time." >&2
              exit 1
            fi
            sleep 2
          done

          cat /tmp/chmarl-live.json
          curl --fail --silent --show-error http://127.0.0.1:8787/version
          curl --fail --silent --show-error http://127.0.0.1:8787/ > /tmp/chmarl-index.html
          grep --quiet '<div id="root"></div>' /tmp/chmarl-index.html

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Keep every valid AIS row without count or location caps"
          git push origin HEAD:agent/unbounded-global-ais
