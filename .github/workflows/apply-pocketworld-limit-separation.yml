name: Apply PocketWorld page and fleet limit separation

on:
  push:
    branches:
      - agent/separate-pocketworld-page-fleet-limits
    paths:
      - scripts/apply-pocketworld-limit-separation.mjs
      - .github/workflows/apply-pocketworld-limit-separation.yml

permissions:
  contents: write

concurrency:
  group: apply-pocketworld-limit-separation
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out limit-separation branch
        uses: actions/checkout@v6
        with:
          ref: agent/separate-pocketworld-page-fleet-limits
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Apply reviewed provider-limit change
        run: |
          node --check scripts/apply-pocketworld-limit-separation.mjs
          node scripts/apply-pocketworld-limit-separation.mjs
          node --check server/vessel-feed-proxy/pocketworld-live-ais.mjs

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, build, and verify runtime
        run: pnpm check

      - name: Verify generated artifacts
        run: pnpm verify:dist

      - name: Check repository diff
        run: git diff --check

      - name: Build production container
        run: docker build --tag chmarl-datav:limit-separation .

      - name: Smoke production container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name chmarl-limit-separation --publish 8787:8787 chmarl-datav:limit-separation
          cleanup() {
            docker logs chmarl-limit-separation || true
            docker rm --force chmarl-limit-separation >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8787/health/live > /tmp/chmarl-live.json; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "The production container did not become live in time." >&2
              exit 1
            fi
            sleep 2
          done

          cat /tmp/chmarl-live.json
          curl --fail --silent --show-error http://127.0.0.1:8787/version

      - name: Commit validated provider-limit separation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Separate PocketWorld page and fleet limits"
          git push origin HEAD:agent/separate-pocketworld-page-fleet-limits
