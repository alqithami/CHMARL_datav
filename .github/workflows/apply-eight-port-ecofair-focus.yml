name: Apply eight-port EcoFair focus

on:
  push:
    branches:
      - agent/eight-port-ecofair-focus
    paths:
      - scripts/apply-eight-port-ecofair-focus.mjs
      - scripts/smoke-eight-port-ecofair-focus.mjs
      - .github/workflows/apply-eight-port-ecofair-focus.yml

permissions:
  contents: write

concurrency:
  group: apply-eight-port-ecofair-focus
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out focus branch
        uses: actions/checkout@v6
        with:
          ref: agent/eight-port-ecofair-focus
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Validate and apply eight-port changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-eight-port-ecofair-focus.mjs")
          text = path.read_text()
          old = "\nwriteEightPortSmoke();\n"
          if old not in text:
              raise SystemExit("Could not disable the embedded smoke-file generator")
          path.write_text(text.replace(old, "\n// The validated smoke file is committed directly.\n", 1))
          PY
          node --check scripts/apply-eight-port-ecofair-focus.mjs
          node --check scripts/smoke-eight-port-ecofair-focus.mjs
          node scripts/apply-eight-port-ecofair-focus.mjs

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, build, and verify runtime
        run: pnpm check

      - name: Verify production artifacts
        run: pnpm verify:dist

      - name: Check generated diff
        run: git diff --check

      - name: Build production container
        run: docker build --tag chmarl-datav:eight-port .

      - name: Smoke production container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name chmarl-datav-eight-port --publish 8787:8787 chmarl-datav:eight-port
          cleanup() {
            docker logs chmarl-datav-eight-port || true
            docker rm --force chmarl-datav-eight-port >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8787/health/live > /tmp/chmarl-live.json; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "The production container did not become live in time." >&2
              exit 1
            fi
            sleep 2
          done

          cat /tmp/chmarl-live.json
          curl --fail --silent --show-error http://127.0.0.1:8787/version
          curl --fail --silent --show-error http://127.0.0.1:8787/ > /tmp/chmarl-index.html
          grep --quiet '<div id="root"></div>' /tmp/chmarl-index.html

      - name: Commit validated eight-port implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Keep full AIS fleet and focus EcoFair on eight ports"
          git push origin HEAD:agent/eight-port-ecofair-focus
