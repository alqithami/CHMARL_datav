name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Production build and runtime smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Verify CI and release contract
        run: node scripts/verify-ci-contract.mjs

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, build, and verify runtime
        run: pnpm check

      - name: Verify generated artifacts
        run: pnpm verify:dist

      - name: Check repository diff
        run: git diff --check
