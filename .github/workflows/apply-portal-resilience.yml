name: Finalize portal resilience patch

on:
  push:
    branches:
      - agent/restore-portal-resilience
    paths:
      - scripts/finalize-portal-resilience.mjs
      - .github/workflows/apply-portal-resilience.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/restore-portal-resilience
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply reviewed runtime refinements
        run: node scripts/finalize-portal-resilience.mjs

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production dashboard
        run: pnpm build

      - name: Verify runtime contract and smoke test
        run: pnpm verify:runtime

      - name: Check generated diff
        run: git diff --check

      - name: Commit reviewed runtime refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/vessel-feed-proxy/runtime-v3.mjs \
            render.yaml \
            package.json \
            scripts/check-runtime-contract.mjs
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Refine portal resilience safeguards"
          git push origin HEAD:agent/restore-portal-resilience
