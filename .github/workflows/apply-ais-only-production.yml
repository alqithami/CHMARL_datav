name: Apply AIS-only production repair

on:
  push:
    branches:
      - agent/ais-only-production
    paths:
      - scripts/apply-ais-only-production.mjs
      - .github/workflows/apply-ais-only-production.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: agent/ais-only-production
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Correct one-time transformation literals
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-ais-only-production.mjs')
          text = path.read_text()
          old = '''  const next = content.replace(pattern, replacement);\n  pattern.lastIndex = 0;\n  if (pattern.test(next)) throw new Error(`Replacement left ${label} behind`);\n  return next;'''
          new = '''  return content.replace(pattern, replacement);'''
          if old not in text:
              raise SystemExit('transformation guard block not found')
          text = text.replace(old, new, 1)
          text = text.replace('${baseUrl}', r'\${baseUrl}')
          text = text.replace('${error instanceof Error', r'\${error instanceof Error')
          path.write_text(text)
          PY

      - name: Apply AIS-only production changes
        run: node scripts/apply-ais-only-production.mjs

      - name: Finalize generated AIS-only contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          contract_path = Path('scripts/check-runtime-contract.mjs')
          contract = contract_path.read_text()
          broken = 'assertIncludes(runtime, "String(process.env.AISSTREAM_API_KEY ?? "").trim()", "AIS API key is not normalized");'
          fixed = 'assertIncludes(runtime, \'String(process.env.AISSTREAM_API_KEY ?? "").trim()\', "AIS API key is not normalized");'
          if broken not in contract:
              raise SystemExit('generated AIS key assertion was not found')
          contract = contract.replace(broken, fixed, 1)

          runtime_path = Path('server/vessel-feed-proxy/runtime-v3.mjs')
          runtime = runtime_path.read_text()
          static_fallback = '  const staticMatch = staticFileForUrl(request.url);\n'
          api_guard = '  if (path.startsWith("/api/")) return sendJson(response, 404, { error: "API endpoint not found" });\n\n'
          if static_fallback not in runtime:
              raise SystemExit('static fallback insertion point was not found')
          runtime = runtime.replace(static_fallback, api_guard + static_fallback, 1)
          runtime_path.write_text(runtime)

          assertion_anchor = 'assertNotIncludes(runtime, "/api/vessels/ingest", "manual vessel ingest endpoint remains enabled");\n'
          api_assertion = 'assertIncludes(runtime, \'path.startsWith("/api/")\', "unknown API routes do not return 404");\n'
          if assertion_anchor not in contract:
              raise SystemExit('manual ingest contract assertion was not found')
          contract = contract.replace(assertion_anchor, assertion_anchor + api_assertion, 1)
          contract_path.write_text(contract)
          PY

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate application and runtime
        run: pnpm check

      - name: Verify generated artifacts
        run: pnpm verify:dist

      - name: Check repository diff
        run: git diff --check

      - name: Commit validated repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use live AIS exclusively for vessel tracking"
          git push origin HEAD:agent/ais-only-production
