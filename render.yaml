services:
  - type: web
    name: chmarl-datav
    runtime: docker
    plan: starter
    numInstances: 1
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: checksPass
    healthCheckPath: /health/live
    renderSubdomainPolicy: enabled
    maxShutdownDelaySeconds: 60
    disk:
      name: chmarl-runtime-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8787
      - key: STATIC_DIR
        value: dist
      - key: RUNTIME_DATA_DIR
        value: /var/data
      - key: VITE_VESSEL_DATA_URL
        value: /api/vessels
      - key: VITE_VESSEL_FETCH_INTERVAL_MS
        value: 15000
      - key: VITE_CHMARL_EXPERIMENT_URL
        value: /api/chmarl/episode
      - key: VITE_PORT_EVENTS_URL
        value: /api/port-events
      - key: VITE_PORT_EVENTS_DEMO_ENABLED
        value: false
      - key: VITE_WEATHER_URL
        value: /api/weather
      - key: VITE_ALLOW_SAMPLE_DATA
        value: false
      - key: VITE_ALLOW_SAMPLE_CHMARL
        value: false
      - key: VITE_REQUIRE_OPERATIONAL_REGION
        value: false
      - key: TX97_CHARTS_ENABLED
        value: true
      - key: TX97_STYLE_URL
        sync: false
      - key: TX97_PUBLIC_DISPLAY_AUTHORIZED
        value: false
      - key: TX97_ALLOWED_ORIGINS
        sync: false
      - key: TX97_BEARER_TOKEN
        sync: false
      - key: TX97_API_KEY
        sync: false
      - key: TX97_API_KEY_HEADER
        value: x-api-key
      - key: TX97_CHART_COLLECTION
        value: Licensed TX-97 chart collection
      - key: TX97_REQUEST_TIMEOUT_MS
        value: 20000
      - key: TX97_CACHE_SECONDS
        value: 300
      - key: AISSTREAM_API_KEY
        sync: false
      - key: AISSTREAM_URL
        value: wss://stream.aisstream.io/v0/stream
      - key: AISSTREAM_GLOBAL_TRACKING_ENABLED
        value: true
      - key: AISSTREAM_TRACKING_BBOX
        value: -90,-180;90,180
      - key: AISSTREAM_FILTER_TYPES
        value: ""
      - key: AISSTREAM_OPERATIONAL_PRIORITY_ENABLED
        value: true
      - key: AISSTREAM_OPERATIONAL_BBOX
        value: 11,32;31,56|20.70,38.35;22.95,39.85|23.25,37.15;24.90,38.90|16.15,41.75;17.55,43.35|25.70,49.25;27.25,50.90|24.35,54.35;25.65,55.75|29.20,32.00;30.55,33.25
      - key: AISSTREAM_OPERATIONAL_FILTER_TYPES
        value: PositionReport,StandardClassBPositionReport,ExtendedClassBPositionReport,LongRangeAisBroadcastMessage
      - key: AISSTREAM_MAX_VESSELS
        value: 20000
      - key: AISSTREAM_OPERATIONAL_MAX_VESSELS
        value: 3000
      - key: AISSTREAM_MAX_AGE_MS
        value: 21600000
      - key: AISSTREAM_TRAIL_POINTS
        value: 4
      - key: AISSTREAM_MAX_IMPLIED_SPEED_KN
        value: 120
      - key: AISSTREAM_RECOVERY_ENABLED
        value: true
      - key: AISSTREAM_HEARTBEAT_MS
        value: 10000
      - key: AISSTREAM_FIRST_FRAME_TIMEOUT_MS
        value: 30000
      - key: AISSTREAM_SILENCE_TIMEOUT_MS
        value: 90000
      - key: MAX_INGEST_BODY_BYTES
        value: 5242880
      - key: AISSTREAM_CACHE_ENABLED
        value: true
      - key: AISSTREAM_CACHE_FILE
        value: /var/data/ais-tracking-cache.json
      - key: AISSTREAM_OPERATIONAL_CACHE_FILE
        value: /var/data/ais-operational-cache.json
      - key: AISSTREAM_CACHE_FLUSH_MS
        value: 30000
      - key: DATALASTIC_AIS_ENABLED
        value: true
      - key: DATALASTIC_API_KEY
        sync: false
      - key: DATALASTIC_API_BASE_URL
        value: https://api.datalastic.com/api/v0
      - key: DATALASTIC_ACTIVATION_DELAY_MS
        value: 45000
      - key: DATALASTIC_SCAN_INTERVAL_MS
        value: 900000
      - key: DATALASTIC_TIMEOUT_MS
        value: 15000
      - key: DATALASTIC_SCAN_RADIUS_NM
        value: 50
      - key: DATALASTIC_MAX_AGE_MS
        value: 2700000
      - key: DATALASTIC_MAX_VESSELS
        value: 5000
      - key: DATALASTIC_SCAN_POINT_IDS
        value: "Jeddah,King Abdullah Port"
      - key: POCKETWORLD_AIS_ENABLED
        value: true
      - key: POCKETWORLD_API_URL
        value: https://pocketworld.org/api/ships
      - key: POCKETWORLD_ACTIVATION_DELAY_MS
        value: 45000
      - key: POCKETWORLD_POLL_INTERVAL_MS
        value: 300000
      - key: POCKETWORLD_TIMEOUT_MS
        value: 30000
      - key: POCKETWORLD_MAX_AGE_MS
        value: 1800000
      - key: POCKETWORLD_MAX_VESSELS
        value: 2500
      - key: CHMARL_RUNTIME_ENABLED
        value: true
      - key: ECOFAIR_OPERATIONAL_RADIUS_NM
        value: 120
      - key: ECOFAIR_EMISSION_BUDGET_TONNES_PER_DAY
        value: 0
      - key: ECOFAIR_BUDGET_TONNES_PER_VESSEL_PER_DAY
        value: 60
      - key: ECOFAIR_GAMMA_EMIS
        value: 10
      - key: ECOFAIR_GAMMA_FAIR
        value: 5
      - key: ECOFAIR_LAMBDA_LR
        value: 0.05
      - key: ECOFAIR_GINI_LIMIT
        value: 0.35
      - key: ECOFAIR_MINMAX_LIMIT
        value: 0.4
      - key: ECOFAIR_BERTH_RADIUS_NM
        value: 5
      - key: ECOFAIR_ANCHORAGE_RADIUS_NM
        value: 20
      - key: ECOFAIR_TICK_MS
        value: 60000
      - key: ECOFAIR_STATE_FILE
        value: /var/data/ecofair-state.json
      - key: CHMARL_FILE_ENABLED
        value: false
      - key: CHMARL_EXPERIMENT_URL
        sync: false
      - key: CHMARL_EXPERIMENT_TOKEN
        sync: false
      - key: CHMARL_INGEST_TOKEN
        sync: false
      - key: CHMARL_EXPERIMENT_FILE
        value: /var/data/chmarl-episode.json
      - key: PORT_EVENTS_URL
        sync: false
      - key: PORT_EVENTS_FILE_ENABLED
        value: false
      - key: PORT_EVENTS_FILE
        value: /var/data/port-events.json
      - key: WEATHER_URL
        sync: false
      - key: WEATHER_TOKEN
        sync: false
      - key: WEATHER_FILE_ENABLED
        value: false
      - key: WEATHER_FILE
        value: /var/data/weather.json
